---
services:
  cbz_tagger:
    # Named explicitly: the Dockerfile's last stage is `test`, which is what a
    # bare `build: .` would pick up.
    build:
      context: .
      target: runtime
    ports: [8080:8080]
    environment: [TIMER_DELAY=600, LOG_LEVEL=INFO]
    volumes:
      - ~/Downloads/cbz_tagger/config:/config
      - ~/Downloads/cbz_tagger/scan:/scan
      - ~/Downloads/cbz_tagger/storage:/storage
