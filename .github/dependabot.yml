---
# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# The aim is one pull request a week that nobody has to touch: the three
# ecosystems below share a multi-ecosystem group, so their updates arrive
# together, and dependabot-automerge.yml merges that PR once the required
# checks pass. The release workflow then publishes a new image.
#
# Security updates can't join that group (multi-ecosystem groups are
# version-updates only) and otherwise open one PR per vulnerable package. The
# `applies-to: security-updates` group on each entry folds them into one PR per
# ecosystem, and those auto-merge too.
version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
updates:
  # Python — uv resolves from pyproject.toml and writes uv.lock.
  - package-ecosystem: uv
    directory: /
    # `patterns` is required on every member of a multi-ecosystem group.
    patterns: ['*']
    multi-ecosystem-group: dependencies
    # Nobody reviews these PRs before they merge, so wait a week after a
    # release: time for a compromised or broken version to be yanked upstream.
    # Security updates ignore the cooldown.
    cooldown:
      default-days: 7
    groups:
      python-security:
        applies-to: security-updates
        patterns: ['*']
    # The network-facing libraries stay out of the unattended flow. The
    # integration tests that would catch a behavioural change in them cannot
    # run on GitHub Actions — Cloudflare blocks the runners from reaching the
    # live endpoints — so green CI does not mean a bump is safe. A
    # beautifulsoup4 upgrade once passed the unit tests and still broke a
    # plugin connector in real use. Bump these by hand with `make update-latest`
    # and run the integration tests locally. Naming update-types keeps this to
    # version updates; security fixes for them still come through.
    ignore:
      - dependency-name: cloudscraper
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: requests
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: beautifulsoup4
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch

  # React frontend.
  - package-ecosystem: npm
    directory: /frontend
    patterns: ['*']
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
    groups:
      frontend-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
    groups:
      github-actions-security:
        applies-to: security-updates
        patterns: ['*']

  # Base images in the published container. Deliberately not in the group and
  # not auto-merged: the tags are `3.13-alpine` and `25-alpine`, so every
  # update here is a new interpreter or Node release rather than a patch, and
  # that wants a look before it ships.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # pyproject.toml pins requires-python to 3.13, so a newer Python image
      # cannot build. Move the two together by hand.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
