---
# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# This file was deleted by accident in 478105c (the nicegui -> React rewrite)
# on 2026-07-01, so no version updates ran for a month while CVEs were being
# patched by hand. The npm entry covers the frontend that same commit added,
# which never had coverage at all.
#
# Security updates are separate and always run regardless of what's listed
# here; these entries are the routine version bumps.
version: 2
updates:
  # Python — uv resolves from pyproject.toml and writes uv.lock.
  #
  # Only the dev group is batched. Runtime packages arrive one PR each so every
  # upgrade stays individually attributable and individually deferrable. That
  # matters here because the integration tests that would catch a behavioural
  # change in cloudscraper/requests/beautifulsoup4 cannot run on GitHub Actions
  # — Cloudflare blocks the runners from reaching the live endpoints — so green
  # CI does not mean a network-facing bump is safe. A beautifulsoup4 upgrade
  # once passed the unit tests and still broke a plugin connector in real use;
  # it was quick to pin down only because it arrived on its own.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      python-dev-dependencies:
        dependency-type: development
        patterns: ['*']

  # React frontend.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      frontend-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  # Base image in the published container.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
