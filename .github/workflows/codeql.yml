---
name: CodeQL
# Python, TypeScript and the workflow files themselves all analyze without a
# build step, so this is cheap enough to run on every PR alongside the other
# checks.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays, 10:17 UTC. Offset from the other repos so the weekly runs don't
    # all queue at once. The schedule matters even with PR runs: it re-analyzes
    # existing code against newly published queries.
    - cron: 17 10 * * 1
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Uploading results to the Security tab needs write here; everything
      # else stays read-only.
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          # The workflows under .github/workflows: script injection, missing
          # permissions blocks, unpinned actions and the like.
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4
        with:
          category: /language:${{ matrix.language }}
