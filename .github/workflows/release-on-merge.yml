---
name: Create Release on Merge to Main
on:
  push:
    branches: [main]
# Only what this workflow needs: contents:write to cut the GitHub release and
# packages:write to push the image to GHCR. Both are covered by the workflow's
# own GITHUB_TOKEN, so there are no registry credentials stored in the repo.
permissions:
  contents: write
  packages: write
jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Extract version from pyproject.toml
        id: get-version
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"
      - name: Check if release exists
        id: check-release
        run: |
          RELEASE_EXISTS=$(gh release view "v${{ steps.get-version.outputs.version }}" --json tagName --jq '.tagName' 2>/dev/null || echo "")
          if [ -n "$RELEASE_EXISTS" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release v${{ steps.get-version.outputs.version }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release v${{ steps.get-version.outputs.version }} does not exist"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release
        if: steps.check-release.outputs.exists == 'false'
        run: |
          gh release create "v${{ steps.get-version.outputs.version }}" \
            --title "${{ steps.get-version.outputs.version }}" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Skip Release Creation
        if: steps.check-release.outputs.exists == 'true'
        run: |-
          echo "Skipping release creation - v${{ steps.get-version.outputs.version }} already exists"
      - name: Log in to GitHub Container Registry
        if: steps.check-release.outputs.exists == 'false'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        if: steps.check-release.outputs.exists == 'false'
        id: meta
        uses: docker/metadata-action@703896b4f30f62d53f5530a80bcdc589a3f702bc
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` comes for free: metadata-action's default flavor is
          # latest=auto, which tags the highest semver build as latest.
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.get-version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.get-version.outputs.version }}
            type=semver,pattern={{major}},value=v${{ steps.get-version.outputs.version }}
      - name: Build and push Docker image
        if: steps.check-release.outputs.exists == 'false'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Dockerfile
          # Must be named. The Dockerfile's last stage is `test` (runtime plus
          # pytest/ruff), and an unqualified build would publish that.
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
