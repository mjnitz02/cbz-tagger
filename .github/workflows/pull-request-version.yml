---
name: Auto Bump Version on PR
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  auto-bump-version:
    name: Auto Bump Patch Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Check and bump version
        run: |-
          read_version() { grep -E '^version = ' | sed 's/version = "//' | sed 's/"//'; }
          MAIN_VERSION=$(git show origin/${{ github.base_ref }}:pyproject.toml | read_version)
          CURRENT_VERSION=$(read_version < pyproject.toml)

          # Skip only if the version field itself already differs from the base
          # branch. This used to test whether pyproject.toml had changed at all,
          # which silently broke every Dependabot Python PR: those always touch
          # pyproject.toml (that's where the dependency constraints live) while
          # leaving `version` alone, so the bump was skipped and the companion
          # "Verify Version Bumps" job then failed the PR for not bumping.
          if [ "$CURRENT_VERSION" != "$MAIN_VERSION" ]; then
            echo "Version already bumped ($MAIN_VERSION -> $CURRENT_VERSION). Nothing to do."
            exit 0
          fi

          # Bump the patch version
          IFS='.' read -r MAJOR MINOR PATCH <<< "$MAIN_VERSION"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "Bumping version from $MAIN_VERSION to $NEW_VERSION"

          # Update pyproject.toml
          sed -i "s/^version = \"${MAIN_VERSION}\"/version = \"${NEW_VERSION}\"/" pyproject.toml

          # Update uv.lock (cbz-tagger package entry)
          sed -i '/^\[\[package\]\]/{N;N;s/name = "cbz-tagger"\nversion = "'"${MAIN_VERSION}"'"/name = "cbz-tagger"\nversion = "'"${NEW_VERSION}"'"/}' uv.lock

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "Bump version"
          git push
